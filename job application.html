    <section id="application-form" class="content">

        <div class="application-form">
            <form action="file:///O:/LEVEL%203%20YR%201/ANDRE%20Level%203%20unit%206/A2/Untitled%20wb-1.html#" method="POST">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required="">
